name: Build map and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 3 * *"   # monthly data refresh (3rd of each month, 04:17 UTC)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Month key for the download cache
        id: month
        run: echo "key=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .stellome-cache
          key: stellome-data-${{ steps.month.outputs.key }}
      - name: Build the map
        run: npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp Stellome.html site/index.html
          cp Stellome.html site/Stellome.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
